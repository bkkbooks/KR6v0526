body:
  text: 偈菴程嘉燧輯四高僧祠寶祐志寺有四高僧祠唐之懷述吳人常達及朱梁彥稱宋晤恩皆邑人按四公行履見高僧傳及劉拯詩甚詳而俗稱四高僧有降龍伏虎朝陽對月之目伏虎者稱公也降龍者則貞觀中老宿也俗語流傳往往見之碑版宜刊正之宋僧居簡破山高僧塔居簡號北澗蜀人慶元嘉熙間嘗居西湖鄮山有北澗詩文集寺倚四僧傳僧今已蛻蟬塔隨榛棘老德與苾芻全翠滴添衣重雲深染屨鮮何年山脊斷飛去玉蜿蜒唐高僧常達塔邑志字文舉年七十四歲塔在興福寺東南三百步唐吳郡破山寺常達傳見有宋宋高僧傳明律篇贊寧智輪奉勑撰釋常達字文舉俗姓顧海隅人也發迹河陽大福山遊學江淮諸勝寺達允迪中和克完戒法專講南山律鈔後求涅槃圓音法華止觀復通隂符老莊百家之書其餘分時之學盡二王之茟迹後隨方參禪詣于宗極俄屬武宗滅法嘆曰我生不辰不自我後繇是寢默山捿委裘遁世而無悶焉宣宗重建法幢荐興精舍合境人民皆達之化導故太守韋曙特加崇重身不衣繒纊室惟蒙薜蘿四衆知歸諸方慕化其潔白寉鷺如也咸通十二年合郭僧民請紹四衆教誨或遊遨坰牧或肅傲海壖不出林麓動經數載雖貴士單車詣門莫得而見於七五言詩追用元和之體著青山履道歌播人脣吻忽於自恣明辰鳩衆于長廊合掌遂申長別辭甚㓻正因臥疾不起絶食七日而逝實咸通十五年九月十六日也春秋七十四僧臘五十一門人會清傳朗奉靈柩殯于寺之東南三百步後年即墳起塔頴川陳言撰塔銘邑大夫汝南周思輯為檀信乾符四年立碑焉劉拯文舉塔唐高僧常達字文舉通涅槃經莊老書隱迹此山雖王侯詣門莫得而見塔在寺之東南圓昔探雙林巵言發南華萬理歸一空誰云正非邪門影搖青松曾回貴侯車猶遺數層塔岌岌凌飛霞唐高僧懷述塔邑志在常達塔東北字體如戒行不下常達劉拯體如塔高僧懷述字體如學涅槃伊字沙門遭武宗沙汰至大中仍復僧衣始終無瑕塔在文舉塔之東北妙理悟三伊巍巍抗竒節千尺巖下松蕭然獨凌雪珠影雖青黃月輪猶圓闕危石揚寒泉至今伴清絶梁高僧彥稱塔梁寶祐志彥稱年九十九歲戒行清苦一夜登閣有虎中矢咆哮于地稱徐為拔之虎偃伏瞑目舐血顧稱而去至曉獵師朱德尋蹤而至稱示以矢鏃朱感悟為罷獵有碑存焉塔在興福寺東梁蘇州破山興福寺彥稱傳壽闍黎附見亦見高僧傳明律篇釋彥稱姓龔氏吳郡常熟人也揭厲戒律錙銖塵務勤求師範唯善是從末扣擊繼宗記主得其戶牖乃於本生地講導同好鳩聚律風孔扇號為毗尼窟宅焉先是海隅巫咸氏之遺壤招真治之舊墟古寺周圍不全垝垣而已嘗一夜有虎中獵人箭伏于寺閣哮吼不止稱憫之忙係鞋秉燭下閣言欲拔之弟子輩扶遏且止者三四俟其更闌各睡乃自持炬就拔其箭虎耽耳舐矢鏃血顧稱而瞑目焉質明獵師朱德就寺尋虎稱告示其箭朱德悛心罷獵焉武肅王錢氏知重每設冥齋召行持明法時覆肩衣自肱而墮還自搭上或見鬼物隨侍焉所謂道德盛則鬼神助也以貞明六年六月終于山房年九十九歲云次壽闍黎者淮浦左右貞諒不群護防正念時少雙偶傳南山律鈔極成不看他靣唐李楊氏奄有廣陵頻召供施四遠崇重食惟正命不畜盈長戶不施關及臨壇度弟子正乘羯磨未周三法忽爾坐亡于覆釜之畔聞見驚嘆與救虎閣邑志在三門東偏又有伏虎橋在邑厲壇左百步俗傳高僧騎虎入城虎伏候于此橋故名劉拯救虎閣朱梁高僧彥稱嘗一夜有虎中箭投伏寺閣稱閔之下拔箭其虎舐血顧稱而去閣基在三門之東偏三昧遊深慈結宇依蒼崕猛虎伏巍閣拔箭非忘骸窮獸雖覆車危雀亦投懷况我見已忘而彼猶其儕宋陳表高僧彥稱塔茁茁霜髭百歲身慣持清苦發慈仁不因解脫於莬厄一箭那能悟獵人宋高僧晤恩塔邑志太宗雍熙中通天台教起宗教院于破山塔與梁彥稱塔相近有石存焉按朱長文續圖經及劉拯破山八詠止載文舉體如二塔而邑志并載稱公恩公二塔稱公傳云終于山房則塔在破山無疑而恩公傳則云坐化于杭之慈光院今其塔仍在破山有碑石可考蓋慈光化後歸舍利于此山與宋僧北澗詩云寺倚四僧傳僧今已蛻蟬四公塔皆在破山可無疑也大宋杭州慈光院晤恩傳見有宋高僧傳義解篇釋晤恩字修已姑蘇常熟人也姓路母張氏嘗夢梵僧入其家而妊焉及稚孺見沙門相必起迎遲年十三聞誦彌陀經遂求出家親黨饒愛再三沮之乃投破山興福寺受訓後唐長興中受滿分戒登往崑山慧聚寺學南山律晉天福初從檇李皓端師聽習經論懸解之性天然時輩輒難抗敵後微聞天台三觀六即之説冥符意解漢開運中造錢塘慈光寺志因師講貫彌年通達法華光明經止觀論咸洞玄微尋施覆述出弟子相次角立雍熙三年八月朔日恩于中夜覩白光自井而出明滅不恆謂門人曰吾報齡極于此矣乃絶粒禁言一心念佛次夢擁衲沙門執金爐焚香三繞其室自言祖師灌頂來此相迎汝當去矣夢覺呼弟子至猶聞異香至二十五日為弟子説止觀旨歸及觀心義辰時端坐靣西而化享年七十五僧臘五十五其夜院僧有興文偃等皆聞空中絲竹嘹亮而無鞉鼓且多鈴鐸漸久漸遠依稀西去逮九月九日依西域法焚獲舍利青白圓粒無算恩平時謹重一食不離衣鉢不蓄財寶臥必右脅坐必加趺弟子輩設堂居亦同今之禪室立制嚴峻日別親視明相方許淨人施粥曾有晚飲薯蕷湯者即時擯出黌堂每一布薩則潸灑不止蓋思其大集滿洲之言耳遍誨人以彌陀淨業救生死事受教得生感祥可見者往往有之凡與人言不問賢不肖悉示以一乘圓意或怪不逗機者乃曰與作毒鼓之緣耳不喜雜交遊不好言世俗事雖大人豪族未嘗輒問名居况迃趨其門乎先是天台宗教會昌毀廢文義殘缺談妙之辭沒名不顯恩尋繹十妙之始終研核五重之旨趣講大玄義文句止觀二十餘周戒行兼明目足雙運使法華大旨全美流于代者恩之力也又慊昔人科節與荊溪記不相苻順因著玄義文句止觀金光明金錍論科總三十五帖見行于世吁河漢中有魚泝流而上者何潛泳有所取故恩公不寬乘戒而出弟子十有七人求解而行行耳中吳紀聞曰後唐時崑山慧聚寺有紹明律師僧中傑出者居半山彌勒閣一夕夢神人曰簷前古桐下有石天王像與銅鍾師宜知之詰旦掘地果得二物今尚龕置壁間常熟破山恩高僧嘗學于紹明見本朝僧史天台宗唐荊溪尊者五傳為高論法師清竦高論二弟子羲寂志因寂以教觀正脈傳義通通傳四明知禮志因傳慈光晤恩恩傳𩄇光洪敏奉先源清清傳孤山智圓梵天慶昭境觀解行各師其説志磐統紀云光明玄義有廣略二本恩師著發揮記解釋略本清敏二師共結難辭輔成師義法智撰扶宗釋難力救廣本十種觀心恩師與孤山亦撰辨訛以救發揮之説法智備引詳論號十義書四明學者指恩清昭圓之學為山外宗按恩公當會昌毀廢講演山家教典法華大意昭著于世徒以光明廣略發揮同異衡嶽家世斥為山外山家謂學華嚴唯識者為他宗而𩄇光敏之徒為長水璿師賢首宗推嗣七祖則山外之斥或非通論也公以雍熙三年示寂慈光後三十一年法孫智圓獲遺骨于學衆鑿石為塔葬馬腦坡孤山塔公遺骨在三十一年後則破山之塔豈非其徒先藏骨髮此與宗教院邑志在破山澗上劉拯宗教院雍熙中高僧晤恩通天台教持于此在三門之西偏妙義傳天台迷雲淨如掃初終雖五時修短自三草結隱非此峯獲藏亦珍一作真寶秋來月正圓獨照松一作僧已老光明菴寶祐志興福寺之屬院也熙寧辛亥僧海素經始紹聖丙子訖工在山腰龍鬬澗之上最為勝絶望之縹眇若仙居僧仲殊為之記陳徽猷起宗有宿光明菴詩僧仲殊破山光明菴記仲殊安州人居錢塘為詩敏捷立成辟穀常啖蜜東坡呼為蜜殊作安州老人食蜜歌熙寧中上堂辭衆閉方丈自縊死及火五色舍利不可勝計佛説金光明經是經莫知所始莫究所終杳無形聲廣無邊際最尊最上衆經中王類名曰金不可沮壞之體也現前日用光明之實相也雖天地之大萬物之多幽明之異死生之隔皆不出是經含洪遍覆之無外也廣矣大矣不入二乘之論浩然寂然未離三界之中樂著是經則入起滅輪趨嚮是經則示懺悔法繇懺悔法故能拂樂著之心無樂著之心故能達菩薩之本有大沙門名曰海素以曩故行願愛樂是經出入是經受用是經得是經三昧安樂贊嘆之不已又思一切衆生同入道場供養是經行懺悔法去一切罪垢與人天四衆得清淨果究竟了義入無生法忍安住如如復次香火之地不無擇焉乃相視此山西南頂有竒峯裂澗可以隔塵凡有長松茂竹可以庇經像燕坐屏息歸者悅來者遂以熙寧辛亥經始訖紹聖丙子建立凡三十餘間得東南之絶境擬化城之髣佛背望遼海而鏡空一天前臨尚湖則澄光百里於是擊大金鼓出大音聲諸有聞者合手而至稱曰某甲等以宿昔緣墮塵色界煩惱障難願盡懺除素公乃為整威儀良久而大衆恍然有失瞿然有得悲唬懇切告謝而去往問之則曰所失者煩惱妄想向來覺知今已斷滅所得者口耳不及使豫何言仲殊身隱光明迹涉懺悔聞此殊勝書以自警公命勒于石以示四衆云爾紹聖四年正月十五日霅川空叟記一云雲遊比丘仲殊記仲殊光明菴身是光明幢語是光明經光明聚不散妙有成真形示現三界前何勞問丹青坐斷龍鬬山寶月孤亭亭宋陸曦光明菴曦吳郡人檻外琅玕山外山三峯橫碧有無間塵埃莫便市廛去斜日秋風更倚闌瓔珞柏寶祐志門外二老松如虬龍屈蟠庭有瓔珞樹尤古左開花右結實僧居簡破山瓔珞柏雪枝新縱縱霜子舊玲玲漙露頻添綴縈風緩剪零貫珠煩蟻度編貝倩誰經瑶草隨山盡來尋千歲苓白蓮池寶祐志池産千葉重蕚白蓮芳色異常又云放生池舊即破山興福寺白蓮池為之乾道間令趙善括改就東塔崇教興福寺葉石林避暑録曰裴晉公詩云飽食緩行初睡覺一甌新茗侍兒煎脫巾斜倚繩床坐風送水聲來耳邊公為此詩必自以為得志然吾山居七年享此多矣今歲新茶適佳夏初作小池導安樂泉注之得常熟破山重臺白蓮植其間葉已覆水雖無淙潺之聲然亦澄徹可喜此晉公之所誦詠而吾得之可不為幸乎宋陳掞破山寺雙頭白蓮湘南夜永風露清明月耿耿波益平嬋娟有人步羅襪瓊璫玉珮雙娉婷可憐玉骨埋藏久腸斷人間無復有豈知化作蘭若蓮宿契未忘猶並首想應快意洗塵緣不向謝池爭取妍玻璃盤中淨玉頰一心稽首西方仙請君以圖獻天子當與嘉禾並周史毋令寂寞墮空山泣月悲雲清夜殘尊勝石幢錢穀續吳都文粹云破山自宋以來歷歲久古迹皆廢獨石梁外尊勝石幢猶存其上經刻乃唐平原陸展書清徑有法妙迹也二幢當寺山門前左幢平原陸展書右幢京兆全貞書唐大中中建造宋建炎三年己酉八月二十三日重建舜井南畿志破山寺東北有空心潭舜井邑志在興福寺南又名舜過石梅林大同集云石梅舊志載在破山寺今招真有之在石崖上破山龍堂朱長文吳郡圖經續記常熟縣龍堂唐咸通中縣令周思輯以旱故禜龍于破山之潭上果雨以應于是為堂以祀之記刻今存破山即虞山也父老以謂每歲有龍往來於陽山虞山之間其雲雨可識范成大吳郡志煥靈庿在常熟縣破山唐咸通中所建龍堂也本朝政和二年賜今額五年加賜𩄇惠侯皮日休破山龍堂記禮山林川谷丘陵能生雲為風雨見怪物皆曰神若然者龍亦能為風雨見怪物則其澤之在民厚矣神而祀之又宜矣常熟澤國也風雨怪物日作于民在有其地者苟祀之至被其利祀之不至民受其禍汝南周君為令之初年夏且旱禜其神于破山之上果雨以應君曰受其賜徒禜以報不可也於是命工以土木介其象為室以蔭之著之於典用潔其祀於是風雨時怪物止水旱不為厲連歲以穰其神之澤乎君之祀乎凡雩者春秋之道皆書之勤民之祀也君為其祠已乞文其事日休嘉其為在民故從之咸通十三年二月十九日前攝嶺南東道節度巡官試祕書省較書即皮日休記大觀三年陸韶之煥靈庿記梁天監元年頂山東有蔣媪孕而生白龍失所往三日龍歸若就乳姥怖而死即所居葬之既七日大雷雨冢遷于山腹每歲五月龍率來省墓必暴寒甚風雨或現形山間唐貞觀十年龍嘗鬬黑龍于虞山之東山破水泉出其下有破山寺今興福寺是也邑人因像事龍母子于破山寺西澗旁水旱禱焉咸通十三年夏旱令汝南周思輯雩于破山之潭上果應肖像立宮著之祀典皮日休為記宋太平興國四年令蔣文懌歸其祠于頂山寺破山路縣尉陳于記曰自縣至破山有破山寺又至頂山有頂山寺其路隨山山皆沙石昔有興福僧自出衣鉢纍甎甃之自縣北門至興福寺門止今頂山中峯菴主懷素自破山雙塔甃之以抵頂山又建雙石塔以鎮交衢成于元豐二年之季夏云宋中散大夫陸綰墓盧熊蘇州府志云在破山綰為江淮荊浙𭛁運使卧疾真州官舍儀狀無故動搖尋卒歸葬山下人每夕聞訶導聲從墓門出紅燭夾道如赴燕集繇是樵蘇無敢窺積五十餘年乃已明中憲大夫顧玉柱墓顧公歷仕有聲績為嘉靖間名臣仕至山東副使墓在寺東今遷于墓門之東偏營墓時掘得吳越錢忠懿王所藏阿育王銅塔今尊藏寺中憨山大師清公瞻禮作記僧德清吳越忠懿國王造銅阿育王舍利塔記昔世尊入滅茶毗得舍利八斛四斗分作三分天上人間龍宮各建塔供養爾時阿育王親受一分散閻浮提震旦國得一十九座明州阿育王塔乃其一也其式亦出自西域而舍利燦爛光明變現隨人各見亦有不見者蓋因障有厚薄耳二千年後五代時吳越忠懿國王承先業敬事三寶如式造小銅塔八萬四千座埋藏國內名山世未有知者我明萬曆初常熟顧耿光造其父憲副一江公塋地中掘出一小銅塔高五寸許如阿育王塔式內刻款云吳越國王錢弘俶敬造八萬四千寶塔乙卯年記一十九字外四靣鏤釋迦往因本行示相前則尸毗王割肉飼鷹救鴿後則慈力王割耳燃燈左則薩埵太子投崖飼虎右則月光王捐捨寶首文理密緻滲以金飾顧為太史錢公母舅因公為忠懿王之後遂以塔付之公得此自號聚沙居士志因也乃送興福蘭若供養豫適東遊訪太史過洞聞上座覩其塔竒其事因記之曰佛以法界為身即草葉縷結皆成佛真體况托象者乎良以衆生迷本法身變為三毒成八萬四千煩惱佛以普光明智熏三毒為三德祕藏故變煩惱為八萬四千功德育王所造蓋表功德之數量也吳越王倣造銅塔如其數盡埋地中意表功德藏于衆生心地兾啓一塔則見一種功德即覩法界之全身如從一隙見無際空見可以色相視之哉法身堅固歷劫不磨隨緣應現太史此塔豈從因地示性空之一隙耶萬曆四十五年佛生日憨山沙門德清記鄧黻常熟縣志寺址修廣自官路外山門皆僧業兵火後僧徒散去為人占而為墳比歲豪右據者不已地理家以為山以破敗稱不利葬地僧舍故得僅存縣令馮汝弼見而矜之特與蠲除寺基稅一石四斗升寺已廢訪勝者率喜至焉續吳都文粹同
