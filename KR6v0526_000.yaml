body:
  text: 破山興福寺位於江蘇常熟縣西北破山乃虞山之別山興福寺在縣西九里虞山北嶺下以山光水色名於世唐常建題破山寺後禪院詩云清晨入古寺初日明高林竹徑通幽處禪房花木深山光悅鳥性潭影空人心萬籟此都寂但餘鍾磬音詩頗為後人稱頌故名寺亭為空心亭而破山之秀潔乃益為文人所推許寺始創建於齊四七九五二以邑人郴州牧倪德光捨居第置之是為大慈寺至梁大同三年五三七改為興福寺寺中最著名之建築者厥為四高僧祠即唐之懷述常達梁之彥稱宋之晤恩懷述字體如學涅槃有體如塔常達字文舉通涅槃經及莊老書隱迹破山有文舉塔彥稱曾救中箭之虎于寺閣故有救虎閣之遺迹有彥稱塔晤恩字修己通天台教設宗教院于破山有晤恩塔元明兩代頗有毀敗至萬曆年間始豫增修清康熙三十二年一六九三吳郡司馬李繼勳曾重修大雄殿明末程嘉燧輯寺志前有崇禎壬午十五年西元一六四二錢謙益序志屬草創體例不免駁雜志分五卷卷一記形勝歷代藝文附之卷二記塔院懷述常達彥稱晤恩四高僧傳在焉卷三記明朝以降重建本寺事迹卷四為明朝名僧事略海舟無著鉢菴洞聞等慈等五位名僧是也卷五為清康熙間重修之疏記有重修大雄殿募疏重修興福大雄殿記異二文茲據國立中央圖書館代管北平圖書館所藏明崇禎十五年一六四二序刋本景印按此本原為瞿氏鐵琴銅劍樓所藏後歸京師圖書館志中第五卷收清康熙三十二年重修大雄殿募疏則是志或刻於清康熙間或係後人所增刻因無可考茲依錢序注為明崇禎十五年序刋本破山寺志序余為兒時每從先大夫遊破山寺飯罷絶龍澗下上激流泉拾赭石輒嬉遊竟日長而卒業壯而縛禪捿息山中往往經旬涉月雖在車馬塵𡏖頓踣幽縶之時燈殘漏轉風回月落山阿澗戶齋鍾粥鼓未嘗不髣佛在夢想中也循覽斯志如觀李龍眠山莊圖信足而行自得道路如見所夢如悟前世禪房花木山光潭影與夫此山中名僧勝流經行晏坐高吟長嘯之遺迹皆顯顯然影現卷帙間塵網羈紲餘纍未畢未能以殘生餘年遂樂天草堂之約俯仰今昔為掩卷太息者久之而余於此以有二願焉山寺之廢而復新也先大夫奉王母卞淑人之命經營草昧以潰于成屠長卿寺碑云善女人罄産偈緣似昔賢之捨宅謂王母也王母嘗囑余云山門東西二里許皆古時經堂佛閣舊址伽藍神所呵護汝外王父母之墓逼處寺之東偏汝他日擇善地卜外王父母之宅兆而徙焉用以妥先靈懺宿業汝其勿忘三十年來外王父之子姓纍纍青襟而家益衰落至不能庇其丘木而縱尋斧焉邑志云山名破山葬者皆不吉以佛地因緣論之斯又不足言矣余思王母之言每一瞻拜未嘗不流涕此一願也寺之西有宗教院高僧晤恩演台教之地更西為光明菴跨龍澗之上大比丘素公供金光明經修懺法之地今世盲禪盛行教義衰落余欲斥寺西菜圃隙地架傑閣搆廣院復宗教光明之舊招延高人即中諸公唱演其中使教幢再樹魔焰頓熄即中合掌讃嘆以為希有此又一願也歲月云邁誓願歷然又安知愚公之移山操蛇之神不感其誠而相之乎山僧刻志成余遂以斯言辨于首且以為識焉崇禎壬午嘉平月聚沙居士錢謙益書于優曇室中烏目山圖興福寺圖蘇先子後圖
