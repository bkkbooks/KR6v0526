body:
  text: 偈菴程嘉燧輯本朝以來重建本寺事迹屠隆重建破山寺碑破山寺者虞山名藍也山開一時則自倪牧捨宅寺名千古則繇常建哦詩詩之千古實維兩言山光恱鳥性潭影空人心建為禮佛而成詩余請以詩而論佛夫有山則有光有潭則有影有鳥則有性有人則有心譬之剎竿立表形在而影隨山亦可以言影潭亦可以言光鳥亦可以言心人亦可以言性譬之帝網綴珠交光而涉入山不與鳥期鳥性自恱鳥不與山約山光自臨潭不因人設人心自空人不與潭謀潭影自印寂寂長松惠風來吹則泠然成韻冥冥大地孤月下照則瞥爾生明靈鍾無識應蜀山而自鳴蕤鐵何知聞流徴而忽躍是知大佛靈通咸自衆生之機感如來極聖不度博地之無緣究之則竹下間關花前睍睆鳥性自恱豈須待恱于山光波平寒水雲盡太虛人心自空何必借空于潭影再究之則山本無光鳥亦無性總之能所雙亡潭本無影人亦無心斯是根塵並脫再究之則山光即是佛光鳥性即是佛性悉表真如潭影無非佛影人心無非佛心盡歸般若是故語蕩相則一空一切空大火聚中秋毫不著語建立則一有一切有大紅罏內衆寶俱鎔未能證悟此兩語或尚是凡夫聲詩默契道機即一詩亦何異如來妙偈吾聞此山有大和尚先後住大道場或靈心偉智示遊戲而現通或宿德耆年精木義而弘範繡棟華榱寶相莊嚴金地煙廊霧館叢林盛甲神州滄桑眨眼殿堂塌彼秋風幻泡傷心金碧銷于寒雨佛性無形無形故無變滅佛廬有相有相故有消沈緣以時來事因人造高僧無著者遠從雲水之蹤覽名山而太息遂即榛蕪之地思古迹而經營無言率物桃李之下成蹊至德感人枹鼓之應如響善女人罄産倡緣幾似昔賢之捨宅諸檀信發心樂助一同長者之布金梵宇巍峩倐爾高騫雲表玉毫璀燦煥然光映林端山光潭影亦增秀于往時鳥性人心且振響于雅詠是如來式臨之日佛日中興之期也方殿宇仗緣而落成適道民采真而至止錢侍御汝瞻翁給諫兆隆及侍御子用章進士太學生錢君稱孝孫君子桑等率僧無著問記道民夫闡揚宗乘奉三寶者既願增白業品題名勝志千秋者又樂附青雲吾想劫火洞然定信此碑無恙萬曆三十二年閏九月朔東海屠隆撰京山李維柱書李維楨破山寺碑跋云海虞破山相傳白龍母葬此忽一夕雷雨移其棺改葬今白龍祠而山為之破因是得名建寺自倪牧捨宅始唐常建賦詩而名益顯年遠寺圮錢太史受之王母卞夫人罄其資繕之諸檀那從之名藍復還舊觀屠緯真儀部為之碑是時比丘為蜀無著再傳而其徒衡陽人孚如以錢太史受兹介福于其王母緯真先生言深悟道祕在簡栖頭陀上屬余弟本石書碑余因附數語志其始末如此瞿汝稷重修興福寺唱導文破山興福寺邑人郴州牧倪德光捨宅以建于齊始名大慈入梁乃更今名其地溪澗縈紆巖巘環合多茂林修竹夏日為之滄涼曲磴窈窕四境蕭寂息心了義之侶於以捿止真勝區也當其盛時丹甍翠橑與霞霱爭麗珍木靈花照曜金地歲祀悠漠悉就蕪廢苾芻明昱謂豫曰而知佛法之所以不振歟夫佛法之有毗尼若樹之有柢西竺諸祖靡不受具即曹溪傳衣黃梅後亦受羯磨于智光而悠悠之徒岡念靈鷲苦心屢囑影附丹霞掩耳之一端殊不知翱翔實際木義為春後之復裪針砭膏肓尸羅誠病時之藥上世之能翱翔實際者少應針砭膏肓者多且戒初無戒三千威儀何所拘牽持本無持八萬細行奚為纏繳若奉衆善而無善善之心蠲諸惡而無惡惡之想則苦心者固嘉拾級掩耳者有不同趨哉乃茲齷齪浮説無礙之宗未詣不淄之域偃蹇具縛指揮撥無則擅特之幽求為虛施闡提之無信為正悟是先蹶其靈根又何冀于法蔭故佛法為善世之聖師而毗尼為救時之首務此寺達公稱公稽之往牒皆弘毗尼以垂範者也幸有淨信矢心再興願為唱導俾克蚤成庶幾鵝珠之英比肩慧門麋草之秀接武慈室雖有竊田衣之波旬且見伏于授華鬘之大士耀日域于重昏永雷音於無盡為功不亦偉歟於是豫為踴躍讃嘆遂次第其語以告于介衆興福寺大殿寺蕪廢幾二百年古殿在寺之東偏頽垣敗壁像設崩墜其地皆為荊棘林矣僧徒募修未幾輒棄去無著禪師昱公自天池來誓葺茲宇披攘經營不舍晝夜萬曆二十九年經始大殿三十二年落成三世佛十八羅漢塑像皆備請大藏于南都會其徒以翻閲將建閣尊藏未果而卒興福今復為叢林昱公開山之力也四高僧殿在大殿之左萬曆四十四年治事僧海蓮募憲副錢公建懶融殿在大殿之右崇禎七年治事僧本善募憲副錢公建韋馱殿廊廡萬曆三十八年鉢菴法師捐衣鉢資建四天王殿在山門內萬曆四十七年海蓮募侍郎錢公領衆建地藏殿在天王殿東崇禎十一年治事僧契德募錢公子孫愛建凖提殿在天王殿西崇禎十六年契德募太學陸祉建雲會堂在韋馱殿左側崇禎十二年契德募善信鮑應鴻建東西客寮東寮萬曆三十八年鉢菴弟子六空募建西寮崇禎八年僧契銘募建觀音殿在大殿東北鐵鑄大士像相傳是宋朝物崇禎八年契銘募太學嚴杓建殿之回廊契德募建觀堂在觀音殿左側崇禎十五年契德募善信高雲舉建方丈在大殿之後萬曆二十六年無著禪師建齋堂庫房香積厨茶寮俱契德募建三門崇禎十六年契德募孫公子藩建龍澗橋在三門之東崇禎十五年契德募孫孝廉魯建東房在寺界之東空心潭觀音殿基址皆在焉房之僧貧不能守崇禎八年侍郎錢公祭酒許公太學嚴公等贖歸于寺殿東新闢松岡山地又若干畝西房在寺界之西有應付僧若干人堂之額曰曉雲傍破龍澗竹樹峭蒨可觀興福寺外三門茶菴並去寺六百步崇禎十三年契德募祭酒許公建日居菴在三門內崇禎十五年寺僧恆思建高林菴在三門內萬曆間僧法雨建團瓢在空心潭上遊僧了幻建高僧墓去寺二百步向入于民家萬曆某年僧如子募侍郎錢公贖歸于寺仍建四塔菜園在寺之西凡三畝寺之舊址入于民家萬曆某年施主贈侍郎景行錢公捐資贖歸本寺又五畝在四十五都經字號興福莊山場若干畝在寺之前後左右嚮入民家天啓某年等贖歸于寺僧田六百餘畝四十五都四五啚興福莊經書亦達等號田二百餘畝十四都五啚秉鑑貢勸等號田一百十二畝四十四都三十三啚練村墟移自等號田五十畝四十三都溪假墟元亨等號田五十畝二十九都六啚微字號田二十畝二十七都十三啚姚菴墟造字號田八畝三十都啚歷園等號田四十五畝二十一都啚慈隱等號田四十四畝
