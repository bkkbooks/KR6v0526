body:
  text: 康熙三十二年癸酉上元日吳郡司馬李繼勳重修大雄殿募疏破山之興福寺繇於蕭梁即常少府建後院題詩處也古有遺蹟而今無其人以處之則廢而不傳秀州雪鑑和上功行真實來修祖庭大暢宗風斯其人矣豫蒞官後於諸山皆無所嚮獨尊重和上道德和上亦以豫為可語而無所隱焉先是殿庭中棟為蠧所𩞾諸佛寶幢處危墮間又四宇頺剝和尚謂非宰官力不可屬豫為首倡豫曰噫佛家以象教化行震旦蕊宮紺宇幾遍山陬海澨間矣今之人猶多創精益莊嚴螺髻鏤檀竦棨徒為酒肉漢所居而忍此丈六金身岌岌不保其於功德之軒輊抑何昧耶且觀少府詩曲徑禪房之句窈然秀絶而今之齊鐘講樹遙出於蒼翠窅藹間則深幽之蹟儼然在也山光潭影心與物契有獨悟之趣今和上鳶飛魚躍月到風來之旨遍浹人心何殊遠公蓮社寧止一少府之獨悟獨樂乎哉乃任其棟傾佛危至于名剎就圮古蹟湮淪匪惟負和上繼往開來之意其撫澄漪而見道遡嘉景以流連者將邈焉矣興廢之感能不動於心乎豫馬曹薄俸愧乎全力願有位與邦人士均致力焉事佛也延古蹟也徜徉嘯歌自樂而及乎人使後之視今亦夫今之致美乎少府也若夫由因得果更有種福無漏之論豫不多贅云重修興福大雄殿記異上元攝山人馬贄記破山之興福寺為齊梁舊剎其大殿復搆於明萬曆間中極之下寶相巍然初緣棟材失選不百年而蠧而桁櫨栱榱之朽者多矣峕秀州雪鑑禪師重興祖庭慮珠幢戴危甫欲易之會郡副三韓李公菉園來董海防欽服禪師道德遂為首倡適各邑大夫咸集琴川得共勷焉于是庀材鳩工於康熙甲戌九月之三日先令圬者數十輩升極而去其甃除其瓴甋回翔運旋于上者纍日若無事也繼令梓人又數十輩踞其棟拔其榱桷錐鑿雨施往來如織一木橫亘載億萬鈞而恣之震凌又若無事者意其外或蠧蝕而中好尚如故焉逮棧木既具以繘絡棟群工甫脫趾升棧則訇然有聲及垂絡而下如創中截而十圍之材膚不踰寸其中盡屬腐屑皆如泥滓觀者環堵相顧竦息不知向之載億萬鈞而無危墮使寶華安然又復任群力措施訖無所虞而於一彈指頃忽作異響截然中摧不可思議如此是時讃佛之聲歡如雷動非禪師妙圎功行深心塵剎郡侯之精誠有以感之曷克臻此哉用是檀信景徔多所輸𦔳而殿廡三門衆寮庫𢈔皆山湧翬飛悉具瞻駭六朝選佛之場復輪奐改觀矣記異近于語神九日上梁之辰天清地寧祥雲覆宇佛光照耀于丹陛間有百鳥翔舞之瑞皆不特書
