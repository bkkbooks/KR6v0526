body:
  text: 偈菴程嘉燧輯本朝名僧事畧海舟禪師名普慈吳郡海虞錢氏子也世宗儒業出家于破山寺初至慧日寺聽講楞嚴至但有言說都無實義嘆曰今日言說愈多矣叅鄧尉山萬峰和尚結廬洞庭山塢廿九年後叅安溪東明旵公嗣法闡化景泰元年示寂全身塔于東明左側世壽九十六僧臘七十四得法弟子十二人無著禪師名明昱蜀人也建煉魔場于吳郡天池寺以魔嬈棄去居興福廢寺竱力興復捐衣損食伐木輦土與其仵偕力作者數年二百年蕪廢蔚為寶坊萬曆三十四年卒于寺葬高僧塔旁師為人雄徤峻特心地軒豁孳孳有為法不以禪宗自眩一言半句機鋒逗露如疾雷一擊聞者掩耳嘗與瞿同卿元立共飯師放箸不食瞿問何故放箸師曰且待公數盡箸下米粒老僧大嚼幾口與公看瞿為悚然鉢菴法師名圓信嘉興人也無著歿來住山堅持毗尼晝夜禮誦嘗繇正㝎趣安樂國至于旬時樸誠敦厚丕勤誘掖壊衣不補揣食不味如桃李不言人望而親之萬曆三十八年卒葬在無著塔之右洞聞禪師名法乘吳江李氏子少出家事華山蘭風和尚後叅紫栢憨山兩大師自天目中雲菴徙破山老焉師慈和樂易具大人相所至住山其徒雪菴拮据庀治師焚香宴坐優游傲兀而已天啟三年七月溽暑中示寂越三日入龕垂首趺坐膚理香潔四眾驚嘆墓在破山寺之南雪菴名海蓮俗姓𦵮棄妻薙染晚忽能識字作小偈先洞聞四年沐浴敷坐而卒等慈禪師名廣潤吳興錢氏少雄于貲慷慨負氣多賢豪長者之交工于詩婉弱流麗世所謂錢叔達者也詿誤觸文冈出家事雲棲大師晚捿拂水山居精勤策進羸然老衲顧好與文士游處其于文章意氣未能舍然也萬曆四十七年卒于拂水諸公皆曰等慈名僧也葬于高僧塔之旁俾附以不朽焉
