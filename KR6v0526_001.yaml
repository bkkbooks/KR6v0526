body:
  text: 偈菴程嘉燧輯破山宋文林郎祕書省較書郎守縣尉陳于頂山路記云常熟居海濵地無大山縣依山之陽是為隅山以瀕海之隅也又名虞山以昔人治虞于此也山北行九里是為破山以鬬龍破山而為澗也又北行九里為頂山又北行六七里為小山山之南北相距才二十四里而名已不一矣又合而名之或曰烏目山也姑蘇志云慶元志引山海經曰虞山之北岡壠相接即烏目山今頂山之南有烏目澗疑即此也自此東北九十步有空心潭又有舜井寶祐志破山之名舊傳正觀中有老宿在寺説法常有白髯老人每旦必先至一日師問為誰曰某山中白龍也師願見其形老人云我見形時當念摩訶經號助我之威師怖誤誦揭諦神咒神以杵擊龍龍衝山而去遂成破澗又高僧傳云白龍與黑龍交勇衝迸成溪朱長文續圖經云正觀中山中嫗生白龍與一龍鬬于此而成澗舊志云唐貞觀十年夏月白龍與烏龍鬬于虞山之東北衝山而去山裂成澗則又與白龍祠事相涉三説未知孰是中吳紀聞舊傳有四高僧講經山中一老翁日來聽法久之問翁所從來答曰吾非人也龍也因問本相可得見乎曰可已而果以全體現僧恐甚亟誦揭諦咒語揭諦神與龍角力龍不能勝破其山而去續圖經所載不同謂白龍與一龍鬬未知孰是盧熊蘇州府志破山亦虞山之別山因白龍鬬衝山而去故曰破山興福寺吳地記後集云興福寺在縣西九里虞山北嶺下梁大同三年置唐破山興福寺再修功德記此寺始自齊始興五年因邑人郴州牧倪德光捨居第置之是為大慈寺至梁大同三年改為興福寺自為邑為寺歷陳隋四代迄于我唐甲辰歲歲踰三百年會昌末釋教中圮僧難聿興武宗斥去浮屠法寺毀大中踐祚再恢釋教俾飾伽藍先是大檀越主吳興錢公某吳郡顧罕汝南周坦與彼親友兼募信士助修塑像添建殿堂赫赫垂芳傳之不朽以雋僑居是邑廢之興之耳目相接俾書其事有愧斐然中和四年六月五日記范成大吳郡志興福寺在常熟縣西北九里唐寺記云始於齊始興五年按齊無始興年號但有延興中興二號皆止一年流傳之誤如此既是唐碑姑存之即常建題詩處鄭虎臣吳都文粹同朱長文吳郡圖經續記興福寺在常熟縣破山為海虞之勝處齊郴州刺史倪德光捨宅為寺唐常建詩云竹徑通幽處禪房花木深山光恱鳥性潭影空人心即此地也山中有龍鬬澗唐正觀中老嫗生白龍與一龍鬬于此而成此澗有空心潭因常建詩以名有御賜鍾唐懿宗咸通六年所賜有文舉塔體如塔二人者唐之高僧也有救虎閣五代時僧彥稱為虎拔箭於此有宗教院雍熙中高僧晤恩修天台教於此故以名近劉御史拯宰邑作八詠以志其事云范成大吳郡志破山興福寺去邑九里齊始興五年邑人郴州刺史倪德光捨宅為寺名曰大慈梁大同三年改興福寺飛泉石橋修廊復閣氣象雄古多唐時屋也僧堂三柱皆有雷篆倒書竒怪不可識相傳唐初雷震故然寶祐志同郭彖暌車志曰常熟縣破山寺僧堂李唐新建柱有雷神書凡三處蓋昔人所傳謝仙火之類內一柱題字最端謹可識云助溪作火田凡六字上一字作從具從力字書所無字皆作隸體倒書入木三分不類雕刻然各去地丈餘與舊説身長三尺者差異盧熊蘇州府志出宣化門循山而北過報慈寺六里西北入破山興福寺寺多古迹臨龍鬬澗山腰有光明菴唐詩常建題破山寺後禪院清晨入古寺初日明一作照又作曜又作朗高林竹徑通幽處禪房花木深山光恱鳥性潭影空人心萬籟此都寂但餘鍾磬音唐詩記事丹陽商璠撰河嶽英靈集首列建詩愛其山光恱鳥性潭影空人心歐陽公臨行題青州山齋曰吾常喜誦常建詩云竹徑通遇幽處禪房花木深欲效其語作一聮久不可得乃知造意者難為工也晚來青州始得山齋宴息因謂不意平生想見而不能道以言者乃為已有於是益欲希其髣佛竟爾莫獲一言夫前人為開其端其物景又在其目然不得自稱其懷豈人才有限而不可疆吾將老矣文思之衰耶兹為終身之恨爾熙寧庚戌仲夏月望日題姚𡩖西溪叢語曰常建題破山寺後院詩云竹徑通幽處禪房花木深余觀又玄集唐詩類選皆作通熙寧元年歐陽永叔守青州題廨宇後山齋云竹徑遇幽處有以鄠杜石本往河內以見邢和叔始未見時亦頗疑其誤及見碑反覆味之亦以為佳不知別有本耶抑永叔自改耶古人用一字亦不苟也僧清晝晚秋破山寺秋風落葉滿空山古殿集作寺殘燈石壁間昔日經行人去盡寒雲夜夜自飛還高僧傳云皎然名晝姓謝氏長城人留心篇什凡所遊歷皆以詩句牽勸令入佛知有集十卷寶祐志載皎然雙峯百戰後一首題曰遊破山考杼山集乃遊吳匡山破寺詩也今削去吳融送僧歸破山寺萬里指吳山高秋杖錫還別來雙闕老歸去片雲間師在有無外我嬰塵土間居然本相別不要慘離顏僧常達破山山居八詠身間依祖寺志僻性多慵少室遺真旨層樓起暮鍾啜茶思好水對月數諸峯有問山中趣庭前是古松二晚望立虛庭心心見祖情煙開分嶽色雨霽減泉聲遠樹猿長嘯層巖日乍朗更堪論的旨林下筍初生三一室塵埃外翛然秪麼常睡來開寢幔鍾動下禪床溪浸山光冷秋凋木葉黃時題諸祖意欹石看斜陽四西來真祖意秪在見聞中寒鴈一聲過踈林幾葉空心間憐水石身老怯霜風為報參玄者山山月色同五真性寂無機塵塵佛祖師日明庭砌暖霜苦藥苗衰汲水和煙酌栽松帶雪移好聽玄旨處猿嘯嶺南枝六古寺憑闌危時聞舉妙機庭空月色淨夜逈磬聲移漏轉寒更急燈殘冷熖微太虛同萬象相會話玄徽七胡僧論的旨物物唱圓成踈栁春來翠幽窗日漸明禪心親石室蝶翅覆花英好聽談玄處喬松鶴數聲八祖祖唯心旨春融日漸長霜輕莎草緑風細藥苗香月滿真如淨花開覺樹芳谷前鶯囀處時聽話圓常宋詩劉拯破山八詠有序拯字彥修宣州南陵人進士及第知常熟縣元豐元年蘇州常熟縣沙門思雅謁豫言曰海虞之勝鍾于破山然林泉之勢遊觀之繁無近無遠傳之盛矣自倪郴州舍宅為寺數百年間僧人竒士往往間出而人知者願有以發明之余因請而咏其可道者俾靈蹤異迹不掩乎山水之勝云元豐五年四月旦日宣德即知蘇州常熟縣劉拯序興福寺齊郴州刺史倪德光捨宅為寺號大慈院梁大同中改為興福寺峩峩烏目山曾臨貴侯宅重房昔珠翠峻宇換金碧泉激晨霞明松搖暮雲白宜爾山中人日輪自朝夕餘七咏俱別見李湛興福寺湛宋祕書丞大中祥符間人也詩歸載此首訛為唐詩雲門十里長殿塔明朝陽半夜風雨至一作止滿山松檜香清猿嘯遠壑好鳥鳴虛廊塵土斯可濯胡為語滄浪莫儔破山儔吳江人久聞勝地有蓮宮乘興來遊杖瘦筇庭老樛枝翠瓔珞池生並蒂玉芙蓉飛仙何意來題柱開澗當年想鬬龍歸騎回看樓閣處雲深隱隱度踈鍾李光破山興福寺招提清絶冠諸方溪繞山圍勝氣藏好在池塘存舊址依然花木隱禪房風生殿閣元無暑雨後松篁自有香日暮不教清興盡更登絶頂瞰微茫舊志載陳簡齋詩一首乃雒中龍門詩也今削去章康遊龍山康浦城人名山久相望今日為著屐到寺第一義古松足蟠屈一一龍蛇形風雷氣蕭瑟瓔珞檜兩株皆數百年物佛燈耿青熒像設暗金碧雲廊極徘徊老屋共崒兀僧房小盤薄西原訪泉石于其最幽絶似可使築室因而思古人多有愛山癖要之亦何為一賞事已畢上方不及登尚或俟他日無非會心處妙同箭鋒直山靈謂何如移文兹不必作詩留山中併可告來轍元詩周霞賔破山後院一路入青山禪居樹木間竹泉和雨釀梅壑倚雲攀塔冷高僧骨嵐清俗士顏夕陽鍾磬遠相趂采樵還僧如鏡破山寺虞阜前朝寺蕭然一徑深煙霞多古迹花果滿晴林逢石泉應冽空亭晝自隂高僧遺塔在何日復重尋吳訥破山老龍逞餘怒舊觸蒼崖裂崖邊古佛祠年深亦銷歇隂房磷火青曲竇泉聲咽客遊縱竒討摩挲看遺碣朗吟常建詩清風滿林樾李傑遊破山寺和錢世恆韻今日重來續舊遊可堪歲月去如流春光冉冉紅將歇山色隂隂翠不收天晚腥風生虎穴雨深新水溢龍湫老僧煮笋充清供石上三生話未休王同祖遊破山興福寺破龍澗破龍回絶澗靈鷲倚修林紺宇煙霞靜蒼崖松柏深虛無侵海色去住引禪心日夕山風冷幽禽空好音錢籍遊興福寺歸途即事古寺登臨罷肩輿下翠微山僧擕鉢上樵子負薪歸暝雀喧凋葉寒鴉度夕暉獨憐遊客興猶逐野雲飛楊儀遊興福寺為愛禪林好時來坐夕曛幽禽喧敗屋古木墮寒雲細讀逍遙論清談怪石文步兵長嘯罷鼓吹半山聞楊儀贈破山寺洪上人尋春過夏事俱寒惟有留題墨未殘落葉不教潭影靜間雲長伴衲衣還吾難求富徔吾好汝可將心與汝安三十年餘京國夢家山依舊醉中看孫七政春日遊破山遇雨春遊不覺遠幽興轉無涯雨送一峯磬雲埋半壑花暗芳遙更識空翠濕還賖歸處渾迷徑翻疑洞口家邵鍪破山贈李超無得貧字澗戶繩床寄此身眉間精悍色猶存千年寺色松頭冷半日茶煙竹裡貧野鹿健如逃世客嶺雲間似住山人繇來此意無多子與爾蒲團子細論尹嘉賔寄破山樵者李超無三首羡爾佯狂已陸沈青山作伴遂幽尋相思只恐難求覓聞説禪房花木深二江上青山政憶君西風旅鴈自為羣天涯歲晚多冰雪若箇峯頭踏凍雲三自斷文章豈致身忍看時事日沈淪東來山色何驕𥠧思殺當年採藥人龍鬬澗邑志一名破山澗亦云破龍澗相傳龍鬬山裂成澗至今澗石皆赤研之色如代赭畫家用以皴染劉拯龍鬬澗唐正觀中老嫗生白龍與一龍鬬于此而成澗白龍鬬巍峯長澗落千尺靈泉應竒蹤高連莫雲碧寒影凌蒼崕清流動危石八月苗正枯猶能變甘澤宋高九萬題龍山開禧中僧居簡送高菊澗遊吳門序云山隂菊澗高九萬得句法于雪巢林景思于後山為第五世古澗滄浪外晴藍縹眇間木枯曾閲世龍老解分山鳥道秋迷迹禪房晝掩關詩成遊子去流水自潺潺朱砂洞南畿志破山上有破龍澗旁有朱砂洞邑志云在龍鬬澗中大澗邑志在虞山北麓興福寺北空心潭朱長文續圖經云有空心潭因常建詩以名潭有無尾螺相傳有神僧見烹螺者已去其尾放之潭中得生或徙之他處則尾如故劉拯空心潭在殿之東北九十步碧潭發幽石瀟灑無纖塵寒光湛秋月有物難比倫離鈎况無魚千尺徒垂綸到此心已空何用濯我纓明季箎空心潭寺裡寒潭百尺深冷涵秋氣碧沉沉風波不動開明鏡恰比山僧入㝎心空心亭寶祐志寺有通幽軒空心亭蓋取常建詩中語鄧黻志至正五年重修假天祐作記弘治十一年建今又廢假天祐空心亭記天祐字吉甫河南人泰㝎甲子進士為常熟州判官海虞山循常熟州治西北十里而近曰破山直破山之麓有寺曰興福澗流絶山而下瀦為深潭潭之上有空心亭山以崖斷石裂得破山之名亭以唐少府常建詩得空心之名海隅之勝萃于破山而破山之秀鍾于斯亭孱顏峙其前冷冽停其下設置既宜而稱謂允當人知少府之詩之工而不知所以為工一登斯亭不言而喻矣亭之始莫知為誰歲滋久風雨弗支至正五年寺僧徴上人謀撤其故而更創焉走邑士崔君天遊后君議皆許諾二君人望也既相為先後聞者樂趨而朱君其倡者也落成宏敞雅潔十倍其舊先是崔后二君嘗與寺昌上人取少府詩析為韻授四方名士大夫各賦五言一詩至是悉刻梓揭之亭冠以少府詩亭所宜為者始大僃以天祐佐是州而山𠰥亭實所遊歷致書屬為記惟元氣結而為山其秀且竒者所不乏非有文章才藝之士發之未必顯于世破山之以秀傑稱宜矣必少府詩出而後人人知之又必空心之亭立而後人人信之地有待夫人重事有待夫時如此簷甍翬飛棟宇雲湧晴隂雨雲光景變幻遊者稅塵鞅縱清躅蔭林樾之薈蔚睇谷巖之碅磳寓聽于琴築而致迹于氷雪平昔寵榮勢利之膠乎中者蕩然火燼煙滅其𩄇臺虗明直與潭水相為洞照名亭空心疇曰不宜天祐不敏方將命杖屨載茟札從諸君子之後崔君名元方后君名克正朱君名士昭八年九月應奉翰林文字儒林即同知制誥兼國史院編修官假天祐記李傑重建空心亭記虞山為海隅之鎮發脈自北而西迤邐南邁其首則邑治在焉其中支最為深秀以山形磅礴環抱𩄇氣所鍾也舊有寺曰破山今稱興福山下有泉出焉瀦而為潭唐常少府詩所謂潭影空人心者也後人作亭其上興廢屢矣前令嘗再建之實土潭心以為亭基四周所餘不過數尺水源盡窒茂草叢生余致政歸每至輒為之悶然乃諗于邑大夫澶淵胡公巍命義官徐明夫董其役撤去舊材屏除積土攘剔蕪穢濬而深之清泉汩汩灌注冬夏常盈淵渟澄徹可燭鬚眉而天光日華上下交映瑩乎一鑑之空明也於是更樹亭于潭上飾以丹雘楹桷棟宇高出巖崖老梅古檜離立于前修竹長松森繞于後遊于斯者倐然改觀而塵襟開豁萬慮俱消名之曰空心其亦稱情也已張著分題空心亭得枝字山寺無僧澗道疑華亭零落已多時空潭雲動蛟龍影老樹霜摧虎豹姿謾擬稽隂成列坐那同歷下遍題詩明年此地重相憶石上梅花雪滿枝御賜鍾寶祐志寺有御賜鍾是唐懿宗賜鍾文云唐咸通九年歲次戊子正月二十一日勑賜破山興福寺鍾一口重一千三百六十斤劉拯御賜鍾唐懿宗咸通六年賜大聲扣洪鍾萬里來彤廷鳥間棲影重星淡雲氣清餘響繞巖壑林葉如回驚有客發深省塵耳非謾傾
